<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 - join the tiles</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#0e0f1e; color:#ecedff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:520px; text-align:center; }
  h1 { font-size:38px; margin-bottom:10px; }
  .tiles { display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
  .t { width:52px; height:52px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; }
  p { color:#aab0e8; line-height:1.65; margin-bottom:20px; }
  a.play { display:inline-block; background:#8b7cff; color:#0e0f1e; font-weight:700; padding:13px 34px; border-radius:999px; text-decoration:none; font-size:16px; }
  .foot { margin-top:22px; color:#5b5f96; font-size:11.5px; }
</style>
</head>
<body>
<div class="card">
  <h1>2048</h1>
  <div class="tiles">
    <div class="t" style="background:#3c416e">2</div>
    <div class="t" style="background:#4a4f85">4</div>
    <div class="t" style="background:#6d5bd0">8</div>
    <div class="t" style="background:#fb7185;color:#0e0f1e">32</div>
    <div class="t" style="background:#fbbf24;color:#0e0f1e">128</div>
    <div class="t" style="background:#67e8f9;color:#0e0f1e;font-size:13px">2048</div>
  </div>
  <p>Slide the grid. Matching tiles merge into their sum. Every move spawns a new tile, so plan your corners - chase 2048 without locking the board. Score and best are saved on your device.</p>
  <a class="play" href="app.html">Play 2048</a>
  <div class="foot">Built by the hourly app factory - <a style="color:#8b7cff" href="https://github.com/iLanis-agent/2048">source</a></div>
</div>
</body>
</html>
